plugins { id 'com.android.application' }

def releaseVersionName = providers.gradleProperty('VERSION_NAME').getOrElse('1.1.0')
def releaseVersionCode = providers.gradleProperty('VERSION_CODE').map { it.toInteger() }.getOrElse(2)

def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

android {
 namespace 'com.gms.networkguard'
 enableKotlin false
 compileSdk {
  version = release(37) { minorApiLevel = 0 }
 }
 defaultConfig {
  applicationId 'com.gms.networkguard'
  minSdk 30
  targetSdk 35
  versionCode releaseVersionCode
  versionName releaseVersionName
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
 signingConfigs {
  release {
   if (releaseStoreFile) storeFile file(releaseStoreFile)
   storePassword releaseStorePassword
   keyAlias releaseKeyAlias
   keyPassword releaseKeyPassword
  }
 }
 buildTypes {
  release {
   if (releaseStoreFile) signingConfig signingConfigs.release
   minifyEnabled false
  }
 }
 packaging { resources { merges += 'META-INF/xposed/*' } }
 testOptions {
  unitTests.includeAndroidResources = true
  unitTests.all {
   jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
  }
 }
}
tasks.configureEach {
 if (name == 'preReleaseBuild') {
  doFirst {
   if (!releaseStoreFile) throw new GradleException('ANDROID_KEYSTORE_PATH is required for release builds')
  }
 }
}
dependencies {
 compileOnly 'io.github.libxposed:api:102.0.0'
 implementation 'io.github.libxposed:service:102.0.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.17'
 testImplementation 'org.mockito:mockito-core:5.14.2'
 testImplementation 'io.github.libxposed:api:102.0.0'
}
