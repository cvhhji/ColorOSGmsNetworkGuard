name: Build and Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Calculate next version
        id: version
        shell: bash
        run: |
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [[ -n "$latest" ]]; then
            base="${latest#v}"
          else
            base="$(cat VERSION)"
          fi
          IFS=. read -r major minor patch <<< "$base"
          patch=$((patch + 1))
          version="$major.$minor.$patch"
          code=$((GITHUB_RUN_NUMBER + 2))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build installable release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace \
            -PVERSION_NAME=${{ steps.version.outputs.name }} \
            -PVERSION_CODE=${{ steps.version.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk \
            ColorOSGmsNetworkGuard-${{ steps.version.outputs.name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ColorOSGmsNetworkGuard-${{ steps.version.outputs.name }}
          path: ColorOSGmsNetworkGuard-${{ steps.version.outputs.name }}.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            ColorOSGmsNetworkGuard-${{ steps.version.outputs.name }}.apk \
            --target "$GITHUB_SHA" \
            --title "GMS 守护 ${{ steps.version.outputs.name }}" \
            --generate-notes \
            --latest
